<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>This is about the time zones</h2>
    <p id="demo"></p>
    <script>
        const instant=Temporal.Now.instant();
        const local=Temporal.Now.zonedDateTimeISO();
        document.getElementById("demo").innerHTML=instant.toString()+"<br>"+local.toString();
    </script>
</body>
</html>
