<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>This is about the switch</h1>
  <p id="demo"></p>
  <script>
    let day;
    let date=new Date().getDay();
    switch(date){
        case 0:
            day="sunday";
            break;
            case 1:
                day="Monday";
                break;
                case 2:
                    day="Tuesday"
                    break;
                    case 3:
                    day="Wednessday"
                    break;
                    case 4:
                    day="Thursday"
                    break;
                    case 5:
                    day="friday"
                    break;
                    case 6:
                    day="saturday"
                    

    }
    document.getElementById("demo").innerHTML="Today is "+day;
  </script>  
</body>
</html>
