<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <p id="demo"></p>
   <script>
    let text="";
    let i=1;
    while(i<5){
        text+="Hello<br>";
        i++;
    }
 
    document.getElementById("demo").innerHTML=text;
   </script> 
</body>
</html>
